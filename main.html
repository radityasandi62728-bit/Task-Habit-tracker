<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task & Habit Tracker</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1>Task & Habit Tracker</h1>
        </header>
        <main>
            <section class="main-section">
                <h2>List Activity</h2>
                <ul id="task-list">
                    <!-- Tasks will be added here dynamically -->
                </ul>
                <div id="task-count">
                    <p>Total Tasks: <span id="total-tasks">0</span></p>
                    <p>Completed Tasks: <span id="completed-tasks">0</span></p>
                </div>
                <div class="list-form">
                    <div class="form-container">
                        <p>no task available, please add one!</p>
                    </div>
                </div>
                <form id="task-form">
                    <input type="text" id="task-input" placeholder="Enter a new task..." required>
                    <button type="submit">Add Task</button>
                </form>
            </section>
            <!-- input form -->
             <div class="input-form">
                <div class="input-container">
                    <div class="icon">
                        <img src="https://img.icons8.com/ios/50/000000/add--v1.png" alt="Add Icon">
                    </div>
                    <form id="input-form">
                        <input type="text" id="input-field" placeholder="Enter a new habit..." required>
                        <input type="date" id="input-date" required>
                        <button type="submit">Add Habit</button>
                    </form>
                </div>
             </div>
            
            <!-- progress section -->
            <section class="progress-section">
                <h2>Progress</h2>
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <p id="progress-text">0% completed</p>
            </section>
        </main>
    </body>
    <footer>
        <p>&copy; 2024 Task & Habit Tracker. All rights reserved.</p>
    </footer>
</html>
